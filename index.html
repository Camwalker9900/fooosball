<style>

* { box-sizing: border-box; }

body {

  gap: 22px;

/* ---------- masthead ---------- */
.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px 28px;
}
.mast-left { display: flex; flex-direction: column; gap: 8px; }
.eyebrow {

  font-weight: 500;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-3);
}
h1 {
  margin: 0;
  font-size: clamp(34px, 6vw, 56px);
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: .98;
  text-wrap: balance;
}
.lede { font-size: 15px; color: var(--ink-2); max-width: 52ch; }
.lede strong { color: var(--ink); font-weight: 600; }
.mast-right {
  display: flex;
  gap: 26px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  padding-bottom: 6px;
}
.mast-stat { display: flex; flex-direction: column; gap: 2px; }
.mast-stat .k {
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
}
.mast-stat .v { font-size: 17px; font-weight: 500; }

/* ---------- chart card ---------- */
.card {
  background: var(--surface);

  border-radius: 6px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.controls {
  display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 10px 18px;
  padding: 18px 24px 6px;
}
.seg {
  display: inline-flex; border: 1px solid var(--rule-strong);
  border-radius: 4px; overflow: hidden;
}
.seg button {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px; font-weight: 500; letter-spacing: .04em;
  padding: 8px 16px; color: var(--ink-2);

.seg button + button { border-left: 1px solid var(--rule-strong); }

.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.hint { font-size: 12.5px; color: var(--ink-3); }

.plot-wrap { position: relative; padding: 4px 14px 6px; }
.plot { display: block; width: 100%; touch-action: pan-y; }
.plot text { font-family: "IBM Plex Mono", ui-monospace, monospace; }
.empty-note {

  max-width: 380px; text-align: center; font-size: 13.5px; color: var(--ink-2);
  background: var(--surface); padding: 12px 16px; border: 1px solid var(--rule);
  border-radius: 4px; pointer-events: none; line-height: 1.5;
}

.tip {
  position: absolute; pointer-events: none; z-index: 4;
  background: var(--surface); border: 1px solid var(--rule-strong);
  border-radius: 4px; box-shadow: var(--shadow);
  padding: 9px 11px; min-width: 200px; opacity: 0; transition: opacity .09s;
}
@media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
.tip.on { opacity: 1; }
.tip-head {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); padding-bottom: 6px; margin-bottom: 6px;
  border-bottom: 1px solid var(--rule);
}
.tip-row {
  display: grid; grid-template-columns: 14px minmax(0,1fr) auto;
  align-items: center; gap: 8px; padding: 1.5px 0;
}
.tip-key { display: block; width: 14px; height: 2.5px; border-radius: 1px; }
.tip-name {
  font-size: 12.5px; color: var(--ink-2); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.tip-row.hot .tip-name { color: var(--ink); font-weight: 600; }
.tip-val {

  font-variant-numeric: tabular-nums;
}

/* ---------- legend ---------- */
.legend {

.chip {

.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.chip .pct {

.chip[aria-pressed="true"] { color: var(--ink); border-color: currentColor; font-weight: 600; }
.chip[aria-pressed="true"] .pct { color: var(--ink-2); }

footer {

  var DATA = JSON.parse(document.getElementById("odds-data").textContent);
  var SEASONS = DATA.seasons;
  var PIN_SLOTS = ["--s1", "--s2", "--s3"];
  var MAX_PINS = 3;
  var state = { season: "2026", pins: [], hover: null };

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function el(tag, attrs, text) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) { if (attrs[k] !== null) n.setAttribute(k, attrs[k]); }
    if (text !== undefined) { n.textContent = text; }
    return n;
  }
  function div(cls, text) {
    var n = document.createElement("div");
    if (cls) { n.className = cls; }
    if (text !== undefined) { n.textContent = text; }
    return n;
  }
  function pct(v) { return v.toFixed(1) + "%"; }
  function weekLabel(w) { return w === 0 ? "Pre" : "Wk " + w; }
  function season() { return SEASONS[state.season]; }
  function latest() { var s = season(); return s.snapshots[s.snapshots.length - 1]; }
  function ranked() {
    return latest().teams.slice().sort(function (a, b) { return b.champ - a.champ; });
  }
  function seriesFor(mgr) {
    return season().snapshots.map(function (s) {
      var row = null;
      for (var i = 0; i < s.teams.length; i++) { if (s.teams[i].mgr === mgr) { row = s.teams[i]; } }
      return { week: s.week, v: row ? row.champ : 0 };
    });
  }
  function pinColor(mgr) {
    var i = state.pins.indexOf(mgr);
    return i === -1 ? null : css(PIN_SLOTS[i]);
  }
  function defaultPins() {
    return ranked().slice(0, 3).map(function (t) { return t.mgr; });
  }
  function yMax() {
    var m = 0;
    season().snapshots.forEach(function (s) {
      s.teams.forEach(function (t) { if (t.champ > m) { m = t.champ; } });
    });
    return Math.max(20, Math.ceil(m / 10) * 10);
  }

  /* ---------------- masthead ---------------- */
  function renderHead() {
    var live = SEASONS["2026"];
    document.getElementById("league-title").textContent = DATA.leagueName;
    document.getElementById("m-season").textContent = live.season;
    document.getElementById("m-week").textContent = String(Math.max(1, live.asOf));
    var when = new Date(DATA.generatedAt);
    document.getElementById("m-updated").textContent =
      (when.getMonth() + 1) + "/" + when.getDate();
    document.getElementById("eyebrow").textContent =
      "Championship odds race \u00b7 " + latest().teams.length + " teams";

    var snap = live.snapshots[live.snapshots.length - 1];
    var top = snap.teams.slice().sort(function (a, b) { return b.champ - a.champ; })[0];
    var lede = document.getElementById("lede");
    lede.textContent = "";
    lede.appendChild(document.createTextNode("Every team's chance of winning it all, recomputed after each week from "));
    var strong0 = document.createElement("strong");
    strong0.textContent = DATA.sims.toLocaleString() + " simulated seasons";
    lede.appendChild(strong0);
    lede.appendChild(document.createTextNode(". Current favorite: "));
    var strong = document.createElement("strong");
    strong.textContent = top.mgr + " at " + pct(top.champ);
    lede.appendChild(strong);
    lede.appendChild(document.createTextNode("."));
  }

  /* ---------------- chart ---------------- */
  var PAD = { t: 26, r: 96, b: 52, l: 50 };

  function statusLine(s) {
    var partial = (s.partialWeeks || [])[0];
    if (partial) {
      return "Week " + partial + " in progress \u2014 banked points count, " +
        (s.pendingStarters || 0) + " starters still to play";
    }
    if (s.weeksPlayed === 0) { return "Preseason"; }
    return "Through week " + s.weeksPlayed;
  }

  function renderChart() {
    var svg = document.getElementById("plot");
    var wrap = document.getElementById("plot-wrap");
    var s = season();
    var width = Math.max(340, wrap.clientWidth - 28);
    var single = s.snapshots.length < 2;
    var height = single ? 360 : 520;
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.setAttribute("height", height);
    svg.textContent = "";

    var lastWeek = s.regWeeks;
    var top = yMax();
    var iw = width - PAD.l - PAD.r;
    var ih = height - PAD.t - PAD.b;
    var x = function (w) { return PAD.l + (w / lastWeek) * iw; };
    var y = function (v) { return PAD.t + ih - (v / top) * ih; };

    var muted = css("--ink-3"), rule = css("--rule"), axis = css("--rule-strong");
    var recessive = css("--recessive"), ink = css("--ink");

    for (var g = 0; g <= top; g += 10) {
      svg.appendChild(el("line", {
        x1: PAD.l, x2: PAD.l + iw, y1: y(g), y2: y(g),
        stroke: g === 0 ? axis : rule, "stroke-width": 1
      }));
      svg.appendChild(el("text", {
        x: PAD.l - 10, y: y(g) + 4, "text-anchor": "end",
        "font-size": 11.5, fill: muted
      }, g + "%"));
    }
    for (var w = 0; w <= lastWeek; w++) {
      if (w !== 0 && w % 2 !== 0) { continue; }
      svg.appendChild(el("text", {
        x: x(w), y: PAD.t + ih + 22, "text-anchor": "middle",
        "font-size": 11.5, fill: muted
      }, w === 0 ? "Pre" : String(w)));
    }
    svg.appendChild(el("text", {
      x: PAD.l + iw / 2, y: height - 10, "text-anchor": "middle",
      "font-size": 10.5, fill: muted, "letter-spacing": "0.1em"
    }, "REGULAR SEASON WEEK"));

    var mgrs = latest().teams.map(function (t) { return t.mgr; });
    var pinned = [], hot = null;
    mgrs.forEach(function (mgr) {
      var isPin = state.pins.indexOf(mgr) !== -1;
      if (isPin) { pinned.push(mgr); }
      if (state.hover === mgr) { hot = mgr; }
      if (isPin || state.hover === mgr) { return; }
      drawSeries(svg, seriesFor(mgr), x, y, recessive, 1.5, single, 0.8);
    });
    pinned.forEach(function (mgr) {
      if (mgr === hot) { return; }
      drawSeries(svg, seriesFor(mgr), x, y, pinColor(mgr), 2.25, single, 1);
      labelEnd(svg, seriesFor(mgr), x, y, pinColor(mgr), mgr, width);
    });
    if (hot) {
      var c = pinColor(hot) || ink;
      drawSeries(svg, seriesFor(hot), x, y, c, 2.75, single, 1);
      labelEnd(svg, seriesFor(hot), x, y, c, hot, width);
    }

    var cross = el("line", {
      x1: 0, x2: 0, y1: PAD.t, y2: PAD.t + ih,
      stroke: axis, "stroke-width": 1, opacity: 0
    });
    svg.appendChild(cross);
    var hit = el("rect", {
      x: PAD.l, y: PAD.t, width: iw, height: ih, fill: "transparent"
    });
    svg.appendChild(hit);

    var weeks = s.snapshots.map(function (n) { return n.week; });
    hit.addEventListener("pointermove", function (ev) {
      var box = svg.getBoundingClientRect();
      var px = (ev.clientX - box.left) * (width / box.width);
      var wRaw = (px - PAD.l) / iw * lastWeek;
      var near = weeks[0], best = Infinity;
      weeks.forEach(function (wk) {
        var d = Math.abs(wk - wRaw);
        if (d < best) { best = d; near = wk; }
      });
      cross.setAttribute("x1", x(near));
      cross.setAttribute("x2", x(near));
      cross.setAttribute("opacity", 1);
      showTip(near, x(near), box, width);
    });
    hit.addEventListener("pointerleave", function () {
      cross.setAttribute("opacity", 0);
      document.getElementById("tip").classList.remove("on");
    });

    var note = document.getElementById("empty-note");
    if (single) {
      note.hidden = false;
      note.textContent = s.state === "live"
        ? "One data point so far \u2014 the race lines draw themselves in as the season goes. Check back after each week."
        : "Only one snapshot available for this season.";
    } else {
      note.hidden = true;
    }

    document.getElementById("chart-hint").textContent = statusLine(s) +
      (s.championManager ? " \u00b7 " + s.championManager + " won the title" : "");
  }

  function drawSeries(svg, pts, x, y, color, w, single, opacity) {
    if (single) {
      pts.forEach(function (p) {
        svg.appendChild(el("circle", {
          cx: x(p.week), cy: y(p.v), r: w > 2 ? 5.5 : 4.5,
          fill: color, opacity: opacity
        }));
      });
      return;
    }
    var d = pts.map(function (p, i) {
      return (i === 0 ? "M" : "L") + x(p.week).toFixed(1) + " " + y(p.v).toFixed(1);
    }).join(" ");
    svg.appendChild(el("path", {
      d: d, fill: "none", stroke: color, "stroke-width": w,
      "stroke-linejoin": "round", "stroke-linecap": "round", opacity: opacity
    }));
  }

  function labelEnd(svg, pts, x, y, color, mgr, width) {
    var p = pts[pts.length - 1];
    var lx = Math.min(x(p.week) + 9, width - PAD.r + 8);
    svg.appendChild(el("circle", {
      cx: x(p.week), cy: y(p.v), r: 4, fill: color,
      stroke: css("--surface"), "stroke-width": 2
    }));
    svg.appendChild(el("text", {
      x: lx, y: y(p.v) - 6, "font-size": 12, "font-weight": 700,
      fill: css("--ink")
    }, mgr.length > 13 ? mgr.slice(0, 13) + "\u2026" : mgr));
    svg.appendChild(el("text", {
      x: lx, y: y(p.v) + 8, "font-size": 11.5, fill: css("--ink-2")
    }, pct(p.v)));
  }

  function showTip(week, px, box, width) {
    var tip = document.getElementById("tip");
    var s = season();
    var snap = null;
    s.snapshots.forEach(function (n) { if (n.week === week) { snap = n; } });
    if (!snap) { return; }
    tip.textContent = "";
    tip.appendChild(div("tip-head", weekLabel(week) + " \u00b7 " + s.season));
    snap.teams.slice().sort(function (a, b) { return b.champ - a.champ; })
      .forEach(function (t) {
        var isPin = state.pins.indexOf(t.mgr) !== -1;
        var isHot = state.hover === t.mgr;
        var row = div("tip-row" + (isPin || isHot ? " hot" : ""));
        var key = div("tip-key");
        key.style.background = isPin ? pinColor(t.mgr)
          : (isHot ? css("--ink") : css("--recessive"));
        row.appendChild(key);
        row.appendChild(div("tip-name", t.mgr));
        row.appendChild(div("tip-val", pct(t.champ)));
        tip.appendChild(row);
      });
    tip.classList.add("on");
    var scale = box.width / width;
    var left = px * scale + 20;
    if (left + tip.offsetWidth > box.width - 6) { left = px * scale - tip.offsetWidth - 20; }
    tip.style.left = Math.max(6, left) + "px";
    tip.style.top = "18px";
  }

  /* ---------------- legend ---------------- */
  function renderLegend() {
    var legend = document.getElementById("legend");
    legend.textContent = "";
    ranked().forEach(function (t) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      var pinnedNow = state.pins.indexOf(t.mgr) !== -1;
      b.setAttribute("aria-pressed", pinnedNow ? "true" : "false");
      var sw = document.createElement("span");
      sw.className = "swatch";
      if (pinnedNow) { sw.style.background = pinColor(t.mgr); }
      b.appendChild(sw);
      b.appendChild(document.createTextNode(t.mgr));
      var pc = document.createElement("span");
      pc.className = "pct";
      pc.textContent = pct(t.champ);
      b.appendChild(pc);
      b.addEventListener("click", function () { togglePin(t.mgr); });
      b.addEventListener("pointerenter", function () { state.hover = t.mgr; renderChart(); });
      b.addEventListener("pointerleave", function () { state.hover = null; renderChart(); });
      b.addEventListener("focus", function () { state.hover = t.mgr; renderChart(); });
      b.addEventListener("blur", function () { state.hover = null; renderChart(); });
      legend.appendChild(b);
    });
  }

  function togglePin(mgr) {
    var i = state.pins.indexOf(mgr);
    if (i !== -1) { state.pins.splice(i, 1); }
    else {
      if (state.pins.length >= MAX_PINS) { state.pins.shift(); }
      state.pins.push(mgr);
    }
    renderLegend();
    renderChart();
  }

  /* ---------------- footer ---------------- */
  function renderFooter() {
    var live = SEASONS["2026"];
    var f = document.getElementById("footer");
    f.textContent = "";
    f.appendChild(document.createTextNode(
      "Odds from " + DATA.sims.toLocaleString() + " Monte Carlo seasons: real rosters, " +
      "real schedule and byes, measured injury rates, breakout variance, and the " +
      live.playoffTeams + "-team bracket from week " + live.playoffStart + "."));
    var sep = document.createElement("span");
    sep.className = "sep";
    sep.textContent = "\u00b7";
    f.appendChild(sep);
    f.appendChild(document.createTextNode(
      "Weeks already played are locked in as fact. Hover the chart for any week's full standings; " +
      "click a name below the chart to highlight that team's line."));
  }

  /* ---------------- wiring ---------------- */
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.season = b.dataset.season;
      state.hover = null;
      state.pins = defaultPins();
      document.querySelectorAll(".seg button").forEach(function (o) {
        o.setAttribute("aria-pressed", o === b ? "true" : "false");
      });
      renderLegend();
      renderChart();
    });
  });

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    if (resizeTimer) { clearTimeout(resizeTimer); }
    resizeTimer = setTimeout(renderChart, 120);
  });
  var onTheme = function () { renderChart(); renderLegend(); };
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) { mq.addEventListener("change", onTheme); }
  }
  if (window.MutationObserver) {
    new MutationObserver(onTheme).observe(document.documentElement, {
      attributes: true, attributeFilter: ["data-theme", "class", "style"]
    });
  }

  renderHead();
  state.pins = defaultPins();
  renderLegend();
  renderChart();
  renderFooter();
})();
</script>

</body>
</html>
